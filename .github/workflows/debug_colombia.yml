name: Debug buscador Corte Constitucional Colombia

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests==2.32.3

      - name: Diagnosticar buscador_new
        run: python debug_colombia.py
