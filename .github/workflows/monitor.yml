name: Monitor Sentencias — Corte Constitucional Ecuador

on:
  # Ejecutar todos los días a las 08:00 hora Ecuador (UTC-5 = 13:00 UTC)
  schedule:
    - cron: "0 13 * * *"
  # Permite ejecutar manualmente desde la pestaña "Actions" en GitHub
  workflow_dispatch:
    inputs:
      search_text:
        description: "Texto a buscar en sentencias (opcional)"
        required: false
        default: ""
      max_sentences:
        description: "Número máximo de sentencias a revisar"
        required: false
        default: "50"

jobs:
  monitor:
    runs-on: ubuntu-22.04
    permissions:
      contents: write  # Para commitear state.json actualizado

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Diagnóstico — interceptar payload real del buscador
        run: python debug_intercept.py

      - name: Ejecutar monitor de sentencias
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFICATION_EMAILS: ${{ secrets.NOTIFICATION_EMAILS }}
          SEARCH_TEXT: ${{ github.event.inputs.search_text || '' }}
          MAX_SENTENCES: ${{ github.event.inputs.max_sentences || '50' }}
        run: python main.py

      - name: Guardar estado actualizado en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          # Solo commitear si hay cambios en el estado
          git diff --staged --quiet || git commit -m "chore: actualizar estado de sentencias [skip ci]"
          git push
