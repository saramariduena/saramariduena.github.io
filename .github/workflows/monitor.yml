name: Monitor Sentencias — Corte Constitucional Ecuador

on:
  # Ejecutar todos los lunes a las 08:00 hora Ecuador (UTC-5 = 13:00 UTC)
  schedule:
    - cron: "0 8 * * 1"
  # Permite ejecutar manualmente desde la pestaña "Actions" en GitHub
  workflow_dispatch:
    inputs:
      search_text:
        description: "Texto a buscar en sentencias (opcional)"
        required: false
        default: ""
      max_sentences:
        description: "Número máximo de sentencias a revisar"
        required: false
        default: "50"

jobs:
  monitor:
    runs-on: ubuntu-22.04
    permissions:
      contents: write  # Para commitear state.json actualizado

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: TEMP DEBUG — interceptar API Función Judicial
        run: python debug_intercept_funcion_judicial.py

      - name: TEMP DEBUG — subir screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fj-intercept-screenshots
          path: |
            fj_home.png
            fj_after_search.png
            fj_juez_form.png
            fj_resultados.png
          if-no-files-found: ignore
